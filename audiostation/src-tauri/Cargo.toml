[package]
name = "audiostation"
version = "0.2.0"
description = "audiostation — the AuthorLM audio studio: generate, stitch, audit and package an audiobook from the manifests AuthorLM writes"
authors = []
edition = "2021"

[lib]
name = "audiostation_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
tauri-plugin-process = "2"
tauri-plugin-log = "2"
log = "0.4"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "native-tls"] }
tokio = { version = "1", features = ["full"] }

# Watches the audiobook folder so an AuthorLM export shows up at once
# (design §10.3).
notify = "6"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }

[profile.dev]
incremental = true

[profile.release]
panic = "abort"
codegen-units = 1
