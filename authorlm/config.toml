# AuthorLM configuration — decisions, versioned with the code.
# API keys live in .env beside this file, never here. The vendor is
# the model string's prefix ("openai/", "gemini/", "anthropic/") and
# LiteLLM reads that vendor's standard environment variable.
[llm]
enabled = true
model = "gemini/gemini-2.5-flash"

# Optional: temperature. Every [llm]/[critique] call sends 0.2 (llm.py's
# TEMPERATURE constant) when this key is absent anywhere — the default
# before AE-3, unaffected by it. Set a number here to change the whole
# system's default, or "vendor-default" to send NO temperature parameter
# at all — some models (the Claude 5 family, GPT-5.6 Luna below) reject
# any value but 1 and need the parameter left out entirely, not set to 1.
#
# KNOWN MODELS ARE SHAPED AUTOMATICALLY. llm.py's MODEL_PROFILES table
# records the verified contract of each model this project uses, and the
# request is shaped from it before every call: a model the table knows
# rejects `temperature` never receives one, whatever is written here (if
# a number is set for such a model, the client says so in one line and
# omits it anyway). "vendor-default" remains for models the registry
# doesn't know yet — and for those, a provider's own rejection still
# self-corrects once and prints the instruction to add the row.
#
# [critique] (below) can override this per-purpose the same way. There is
# no general parameter passthrough (top_p, penalties, ...) — add another
# purpose-specific knob like this one only when a purpose needs it, the
# way [writing] already carries its own (Sponsor ruling, AE-3).
# temperature = 0.2

# extraction_max_chars caps the manuscript text sent per extraction call.
# Why it exists: cost control is half of it. The other half is extraction
# quality — asked for "10-20 load-bearing concepts" over a very long input,
# models tend to sample shallowly from everywhere rather than reading
# anything deeply, so bounded payloads genuinely extract better.
# It is not a model limit (Gemini 2.5 Flash accepts ~1M tokens).
# Default: 24000 (characters, ~6k tokens).
extraction_max_chars = 24000

# [writing] — DELIBERATELY ABSENT (author ruling 2026-08-30: "I didn't realize it
# would be that expensive… I don't want to be hit with big dollars"). Without this
# section `authorlm write draft` REFUSES by design — beat drafting runs in the
# conversation (subscription-covered), fed by `write draft --dry-run`'s payload.
# To re-enable billed, model-pinned drafting, restore the section (see design §15):
#   model = "anthropic/claude-fable-5", max_tokens = 8000, effort = "high",
#   timeout_seconds = 600, cache = true

[critique]
# Essay summaries and the critique editor on GPT-5.6 Luna (author rulings
# 2026-08-30: "I actually rather like 5.6 luna. Lets try that for
# summarizing essays."). Cheaper than the gemini default (~$0.26 vs ~$0.49
# per full 24-essay rebuild at measured token volumes) and a stronger
# small model. Uses OPENAI_API_KEY from .env.
#
# Luna rejects any `temperature` but 1, SERVER-SIDE — litellm's own local
# param map doesn't know that rule (it isn't Claude 5), so it can't
# preemptively drop the parameter the way it does for Claude 5 (llm.py's
# `litellm.drop_params`); the client's `_rejects_temperature` retry is
# the safety net for exactly this shape (one immediate retry without
# temperature, no backoff burnt, whenever a provider's own 400 says so).
# `temperature = "vendor-default"` below says the same thing PROACTIVELY
# instead of relying on that retry every single call. Resolution order
# (resolve_temperature, llm.py): this section's own value wins, then
# [llm]'s, then the 0.2 constant when neither is set.
#
# Luna now also has a MODEL_PROFILES row (llm.py), so the omission no
# longer depends on this line being right: the line and the registry
# agree, and the registry wins if they ever stop agreeing.
#
# Activated 2026-08-30 after the AE-3 merge + orchestrator live acceptance.
summarizer_model = "openai/gpt-5.6-luna"
editor_model = "openai/gpt-5.6-luna"
temperature = "vendor-default"

[illustrations]
# Illustration rendering (authorlm illus render); text model above ([llm]
# model) is unchanged — the image model is chosen independently.
model = "openai/gpt-image-2"
# Landscape 3:2 — the manuscript's ratified illustration shape. OpenAI's
# image API defaults to a square without it.
image_size = "1536x1024"

[extraction]
# Two-step extraction. On by default (TrackA/3) since pass 2 stopped
# re-sending the full source text (TrackA/1) and its payload cap accounting
# was fixed (TrackA/2). Set to false to fall back to the single-step path.
#
# Step one is the existing extraction call: candidates from the changed
# sections. Step two adds ONE more call per extraction pass: each candidate
# is shown alongside the nearest existing concepts (found deterministically,
# no tokens) and the author's own past rejections, and the model rules
# new | improves | subsumed | drop. Only "new" reaches the triage queue;
# "improves" becomes a note_update proposal against the existing concept;
# "subsumed" and "drop" are logged as evidence and never queued.
#
# Cost: exactly doubles the number of extraction calls (the adjudication
# payload is candidates + neighbours + the same text, so roughly 1.3-1.6x
# the tokens of a single-step extraction). Buys back author triage time.
adjudicate = true

[gdocs]
# OAuth installed-app client for the Google Docs bridge (doc push/pull).
