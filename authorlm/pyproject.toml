[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "authorlm"
version = "0.1.0"
description = "An editorial collaborator for philosophy writing that learns your editorial practice from evidence"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
llm = ["litellm"]
mcp = ["mcp<2"]
gdocs = [
    "google-api-python-client",
    "google-auth-httplib2",
    "google-auth-oauthlib",
]
all = [
    "litellm",
    "mcp<2",
    "google-api-python-client",
    "google-auth-httplib2",
    "google-auth-oauthlib",
]

[project.scripts]
authorlm = "authorlm.cli:main"
authorlm-mcp = "authorlm.mcp_server:main"

[tool.setuptools]
packages = ["authorlm", "authorlm.adapters"]

[tool.setuptools.package-data]
authorlm = [
    "prompts/*.md",
    "publication/*",
    "triage_profiles/*.json",
    "triage_dist/*.html",
]
"authorlm.adapters" = ["*.json"]
