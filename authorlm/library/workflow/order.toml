# The single standard order of the filter passes in the per-essay workflow.
#
# Ticking a pass after construction only includes it; the order always
# comes from this list, whatever order the passes were ticked in. A new
# filter is given its place here when it is added, after the admission
# check (admission-check.md) finds no conflict with the passes before and
# after it.
#
# Before these passes: the letter, then construction (with its wrap-up).
# After them: lint (`book lint`, the code-checked conventions) and the
# proof checks, then the audio stage for a manuscript with an audiobook.
# None of those is on the checklist.
#
# Keys:
#   name     the filter; its text is filters/<name>.md
#   stage    "claims" (what a sentence claims, how strongly, on what
#            source), "line" (sentences on settled content) or "copy"
#   role     the role line from roles.toml this pass runs under
#   default  "ticked" or "unticked": the starting tick on a first
#            instance; "audiobook" means ticked for a manuscript with an
#            audiobook and unticked otherwise. A later instance starts
#            from the last instance's ticks, and a pass the letter marks
#            not needed starts unticked.

[[pass]]
name = "cross-references"
stage = "claims"
role = "line"
default = "ticked"

[[pass]]
name = "claim-strength"
stage = "claims"
role = "line"
default = "ticked"

[[pass]]
name = "unsourced-claims"
stage = "claims"
role = "line"
default = "ticked"

[[pass]]
name = "figures"
stage = "line"
role = "line"
default = "ticked"

[[pass]]
name = "plain-reader"
stage = "line"
role = "line"
default = "ticked"

[[pass]]
name = "repetition"
stage = "line"
role = "line"
default = "ticked"

[[pass]]
name = "concision"
stage = "line"
role = "line"
default = "ticked"

[[pass]]
name = "audio-friendly"
stage = "line"
role = "line"
default = "audiobook"

[[pass]]
name = "copyedit"
stage = "copy"
role = "copyedit"
default = "ticked"
