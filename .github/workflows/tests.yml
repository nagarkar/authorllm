# .github/workflows/tests.yml — runs the whole hermetic suite (authorlm/tests/run_all.py) on every PR,
# so a PR that breaks a test shows red before it merges (issue #363).
# Offline: no Google token and no model keys reach the runner, and test_live_llm.py stays out (no --live).
# llmlm is the sibling checkout CLAUDE.md's install line expects, at its main; it is public, so no secret.
# macOS, where AuthorLM runs: the real `say` checks run there, and one test_api.py check counts on a
# replaced file getting a new inode, which the Linux runner's file system does not give it.
name: tests
on: pull_request
permissions:
  contents: read
concurrency:
  group: tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  suite:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: authorllm
      - uses: actions/checkout@v4
        with:
          repository: nagarkar/llmlm
          path: llmlm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            authorllm/authorlm/pyproject.toml
            llmlm/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version-file: authorllm/authorlm/.nvmrc
          cache: npm
          cache-dependency-path: authorllm/authorlm/web/*/package-lock.json
      # Optional for the suite: without them run_all.py reports those checks as skipped.
      - run: brew install pandoc ffmpeg
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
      # The install builds the three web pages (authorlm/setup.py), which the suite reads.
      # dev: metalm-gendocs, which test_generated_docs.py imports. pymupdf: the pdf2md tests' import,
      # declared in no extra yet.
      - run: pip install -e ../../llmlm -e ".[all,dev]" pymupdf
        working-directory: authorllm/authorlm
      - run: python3 tests/run_all.py
        working-directory: authorllm/authorlm
